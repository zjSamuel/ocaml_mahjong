<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riichi Mahjong Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="table">
    <div class="dora-panel">
      <h3>Dora Indicators</h3>
      <div class="dora-tiles" id="dora-tiles"></div>
    </div>

    <div class="player-label north-label">North (AI)</div>
    <div class="player-label west-label">West (AI)</div>
    <div class="player-label east-label">East (AI)</div>

    <div class="hand-row north-hand" id="north-hand"></div>

    <div class="mid-section">
      <div class="side-column west">
        <div class="hand-column" id="west-hand"></div>
      </div>

      <div class="center-area">
        <div class="discard-grid">
          <div class="discard-pile north" id="discard-north"></div>
          <div class="discard-pile west" id="discard-west"></div>
          <div class="wall-box">
            <div class="wall-label">Wall</div>
            <div class="remaining">Remaining: <span id="remaining-count">0</span></div>
          </div>
          <div class="discard-pile east" id="discard-east"></div>
          <div class="discard-pile south" id="discard-south"></div>
        </div>
      </div>

      <div class="side-column east">
        <div class="hand-column" id="east-hand"></div>
      </div>
    </div>

    <div class="controls">
      <button class="draw-btn" id="draw-btn">Draw Tile</button>
      <button id="discard-btn" disabled>Discard</button>
      <button id="win-btn" class="win">Win (Hu)</button>
      <div class="action-bar">
        <button id="chi-btn" class="action-btn hidden">Chi</button>
        <button id="peng-btn" class="action-btn hidden">Peng</button>
        <button id="rong-btn" class="action-btn hidden">Rong</button>
        <button id="skip-btn" class="action-btn hidden">Skip</button>
      </div>
    </div>

    <div class="south-section">
      <div class="south-header">
        <h3>South (You)</h3>
        <div class="melds" id="melds"></div>
      </div>
      <div class="south-hand-wrap">
        <div class="hand-row south-hand" id="south-hand"></div>
        <div class="draw-slot" id="draw-slot"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="win-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>WIN</h2>
        <button class="close-modal" id="close-modal">X</button>
      </div>
      <p class="modal-subtitle">Winning Hand</p>
      <div class="modal-hand" id="modal-hand"></div>
      <p class="win-summary" id="win-summary"></p>
      <button class="continue-btn" id="continue-btn">Continue</button>
    </div>
  </div>

  <script>
    // If opened via file://, some browsers block ES module imports. Use a local server.
    if (location.protocol === "file:") {
      console.warn("If tiles are missing, start a local server (e.g. `python -m http.server 8000`) and open http://localhost:8000");
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
